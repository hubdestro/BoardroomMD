<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BoardroomMD — Markdown to Professional Documents</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Core libs loaded early so window.docx is available before inline scripts run -->
  <script src="js/docx.js"></script>
  <script>window._docxLib = window.docx;</script>
  <script src="js/assets.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <script src="https://unpkg.com/jszip/dist/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
  /* ============================================================
     RESET
  ============================================================ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  button { cursor: pointer; border: none; background: none; font-family: inherit; }
  a { text-decoration: none; }
  input, textarea { font-family: inherit; }

  /* ============================================================
     DESIGN TOKENS
  ============================================================ */
  :root {
    --navy:      #0b1120;
    --navy-1:    #0f172a;
    --navy-2:    #1e293b;
    --navy-3:    #334155;
    --navy-4:    #475569;
    --slate:     #64748b;
    --muted:     #94a3b8;
    --text:      #e2e8f0;
    --bright:    #f8fafc;
    --green:     #22c55e;
    --green-dk:  #16a34a;
    --green-bg:  rgba(34,197,94,.08);
    --green-glow:rgba(34,197,94,.35);
    --red:       #ef4444;
    --amber:     #f59e0b;
    --editor-bg: #0d1117;
    --preview-bg:#c8d3de;
    --sidebar-w: 268px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  /* ============================================================
     LAYOUT
  ============================================================ */
  body {
    background: var(--navy);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ── Navbar ── */
  .navbar {
    height: 52px;
    background: var(--navy-1);
    border-bottom: 1px solid var(--navy-2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    flex-shrink: 0;
    z-index: 50;
  }

  .nav-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .nav-logo {
    width: 30px; height: 30px;
    background: linear-gradient(145deg, #22c55e 0%, #15803d 100%);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 1px rgba(34,197,94,.2), 0 2px 8px rgba(34,197,94,.25);
    flex-shrink: 0;
  }
  .nav-logo svg { width: 15px; height: 15px; color: #fff; }

  .nav-title {
    font-size: 15px; font-weight: 700;
    letter-spacing: -.3px; color: var(--bright);
  }
  .nav-title em { font-style: normal; color: var(--green); }

  .nav-pill {
    font-size: 10px; font-weight: 600;
    letter-spacing: .04em; color: var(--green);
    background: var(--green-bg);
    border: 1px solid rgba(34,197,94,.18);
    padding: 2px 8px; border-radius: 20px;
  }

  .nav-right { display: flex; align-items: center; gap: 8px; }

  .btn-ghost {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 500; color: var(--muted);
    padding: 6px 10px; border-radius: 6px;
    border: 1px solid transparent; transition: all .15s;
  }
  .btn-ghost:hover { color: var(--bright); background: var(--navy-2); border-color: var(--navy-3); }

  .btn-primary {
    display: flex; align-items: center; gap: 7px;
    font-size: 13px; font-weight: 600; color: #fff;
    background: linear-gradient(145deg, #22c55e, #16a34a);
    padding: 8px 20px; border-radius: 8px;
    border: 1px solid rgba(34,197,94,.3);
    box-shadow: 0 1px 3px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.1);
    transition: all .15s;
  }
  .btn-primary:hover { box-shadow: 0 4px 14px var(--green-glow); transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); box-shadow: none; }
  .btn-primary:disabled { opacity: .55; pointer-events: none; }
  .btn-primary svg { width: 14px; height: 14px; }

  /* ── Workspace ── */
  .workspace { flex: 1; display: flex; overflow: hidden; }

  /* ── Sidebar ── */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--navy-1);
    border-right: 1px solid var(--navy-2);
    display: flex; flex-direction: column;
    flex-shrink: 0;
  }

  .sidebar-body {
    flex: 1; overflow-y: auto;
    padding: 16px;
    display: flex; flex-direction: column; gap: 20px;
  }

  .field-label {
    font-size: 10px; font-weight: 600;
    letter-spacing: .08em; color: var(--navy-4);
    text-transform: uppercase; margin-bottom: 8px;
  }

  .field-group { display: flex; flex-direction: column; gap: 6px; }

  .field-row label {
    font-size: 11px; font-weight: 500;
    color: var(--slate); display: block; margin-bottom: 4px;
  }

  .field-input {
    width: 100%;
    background: var(--navy-2);
    border: 1px solid var(--navy-3);
    color: var(--bright);
    font-size: 13px;
    padding: 7px 10px;
    border-radius: 6px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .field-input::placeholder { color: var(--navy-3); }
  .field-input:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(34,197,94,.12);
  }

  /* Template cards */
  .tpl-cards { display: flex; flex-direction: column; gap: 5px; }

  .tpl-card {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 11px; border-radius: 7px;
    border: 1px solid var(--navy-2);
    cursor: pointer; transition: all .15s; user-select: none;
  }
  .tpl-card:hover { border-color: var(--navy-3); background: var(--navy-2); }
  .tpl-card.is-active { border-color: var(--green); background: var(--green-bg); }
  .tpl-card input { display: none; }

  .tpl-radio {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--navy-3); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .tpl-card.is-active .tpl-radio { border-color: var(--green); background: var(--green); }
  .tpl-card.is-active .tpl-radio::after {
    content: ''; width: 4px; height: 4px;
    border-radius: 50%; background: #fff;
  }

  .tpl-info { flex: 1; min-width: 0; }
  .tpl-name { font-size: 12px; font-weight: 600; color: var(--text); }
  .tpl-desc { font-size: 11px; color: var(--slate); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Mini swatches */
  .tpl-swatch {
    width: 26px; height: 34px; border-radius: 3px;
    flex-shrink: 0; position: relative; overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,.4);
  }
  .sw-corp   { background: #fff; }
  .sw-corp::before  { content:''; position:absolute; top:4px; left:3px; right:3px; height:3px; background:#0F4C81; border-radius:1px; }
  .sw-corp::after   { content:''; position:absolute; top:10px; left:3px; right:6px; height:1.5px; background:#e2e8f0; box-shadow:0 3px 0 #e2e8f0,0 6px 0 #e2e8f0; }
  .sw-modern { background: #fff; }
  .sw-modern::before { content:''; position:absolute; top:4px; left:3px; right:3px; height:3px; background:#22c55e; border-radius:1px; }
  .sw-modern::after  { content:''; position:absolute; top:10px; left:3px; right:6px; height:1.5px; background:#e2e8f0; box-shadow:0 4px 0 #e2e8f0,0 8px 0 #e2e8f0; }
  .sw-prem  { background: #e7ebe4; }
  .sw-prem::before  { content:''; position:absolute; top:0; left:0; right:0; height:12px; background:linear-gradient(135deg,#454F3C,#677659); }
  .sw-prem::after   { content:''; position:absolute; top:16px; left:3px; right:6px; height:1.5px; background:#c4cfc0; box-shadow:0 3px 0 #c4cfc0,0 6px 0 #c4cfc0; }

  /* Status bar */
  .status-bar {
    padding: 9px 16px; border-top: 1px solid var(--navy-2);
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; color: var(--navy-4);
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green); flex-shrink: 0; transition: background .3s;
  }
  .status-dot.loading { background: var(--amber); animation: blink 1s infinite; }
  .status-dot.error   { background: var(--red); }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
  .status-words { margin-left: auto; font-size: 10px; color: var(--navy-3); }

  /* ── Editor pane ── */
  .editor-pane {
    flex: 1; display: flex; flex-direction: column;
    border-right: 1px solid var(--navy-2);
    background: var(--editor-bg); min-width: 0;
  }

  .pane-bar {
    height: 34px; background: var(--navy-1);
    border-bottom: 1px solid var(--navy-2);
    display: flex; align-items: center;
    padding: 0 14px; gap: 5px; flex-shrink: 0;
  }
  .pane-bar-dot { width: 10px; height: 10px; border-radius: 50%; }
  .pane-bar-title {
    font-size: 11px; font-weight: 500;
    color: var(--slate); letter-spacing: .05em;
    margin-left: 8px;
  }

  #markdownInput {
    flex: 1; width: 100%;
    background: var(--editor-bg);
    border: none; outline: none; resize: none;
    color: #a9c2e0;
    font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    font-size: 13.5px; line-height: 1.75;
    padding: 22px 26px; tab-size: 2;
    caret-color: var(--green);
  }
  #markdownInput::placeholder { color: var(--navy-3); }
  #markdownInput::-webkit-scrollbar { width: 5px; }
  #markdownInput::-webkit-scrollbar-thumb { background: var(--navy-2); border-radius: 3px; }

  /* ── Preview pane ── */
  .preview-pane {
    flex: 1; display: flex; flex-direction: column;
    background: var(--preview-bg); min-width: 0;
  }

  .preview-scroll {
    flex: 1; overflow-y: auto;
    padding: 28px 20px 48px;
    display: flex; flex-direction: column; align-items: center;
  }
  .preview-scroll::-webkit-scrollbar { width: 6px; }
  .preview-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,.2); border-radius: 3px; }

  /* Empty state */
  .preview-empty {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px; text-align: center;
    color: #8fa3b8; padding: 40px; min-height: 400px;
  }
  .preview-empty svg { width: 44px; height: 44px; opacity: .25; }
  .preview-empty-title { font-size: 14px; font-weight: 500; color: #7a92a8; }
  .preview-empty-sub { font-size: 12px; color: #6a8096; }

  /* Cover page — full A4-proportioned height */
  .doc-cover {
    width: 100%; max-width: 660px;
    height: 933px;
    border-radius: 4px 4px 0 0;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    padding: 0; flex-shrink: 0;
  }
  .doc-cover h1 { margin: 0; }

  /* Document body page */
  .doc-page {
    width: 100%; max-width: 660px;
    background: #fff;
    padding: 56px 60px;
    box-shadow: 0 20px 48px rgba(0,0,0,.14), 0 0 0 1px rgba(0,0,0,.06);
    border-radius: 0 0 4px 4px;
  }

  /* ============================================================
     TEMPLATE PREVIEW STYLES
  ============================================================ */

  /* ── Corporate Cover ── */
  .tpl-corporate .doc-cover {
    background: linear-gradient(165deg, #071e38 0%, #0c3d6e 50%, #0F4C81 100%);
  }
  .tpl-corporate .cov-topbar {
    height: 5px; flex-shrink: 0;
    background: linear-gradient(90deg, #3a8bc4 0%, #9cd3f7 50%, #3a8bc4 100%);
  }
  .tpl-corporate .cov-inner {
    flex: 1; display: flex; flex-direction: column;
    justify-content: space-between;
    padding: 36px 56px 52px; position: relative; overflow: hidden;
  }
  /* Large decorative circle top-right */
  .tpl-corporate .cov-inner::before {
    content: ''; position: absolute; top: -80px; right: -80px;
    width: 380px; height: 380px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.08) 0%, transparent 70%);
    pointer-events: none;
  }
  /* Second circle ring */
  .tpl-corporate .cov-inner::after {
    content: ''; position: absolute; top: 70px; right: 20px;
    width: 210px; height: 210px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.07);
    pointer-events: none;
  }
  .tpl-corporate .cov-eyebrow {
    font-size: 10px; font-weight: 700; letter-spacing: .2em;
    text-transform: uppercase; color: rgba(255,255,255,.3);
    position: relative;
  }
  .tpl-corporate .cov-mid {
    display: flex; flex-direction: column; position: relative;
  }
  .tpl-corporate .cov-rule {
    width: 44px; height: 3px; background: #5bb3e8; margin-bottom: 20px; border-radius: 2px;
  }
  .tpl-corporate .doc-cover h1 {
    font-size: 38px; font-weight: 800; color: #fff;
    line-height: 1.1; margin: 0 0 18px !important; letter-spacing: -.5px;
  }
  .tpl-corporate .cov-meta-line {
    font-size: 13px; color: rgba(255,255,255,.5);
    display: flex; align-items: center; gap: 10px;
  }
  .tpl-corporate .cov-sep {
    width: 3px; height: 3px; border-radius: 50%;
    background: rgba(255,255,255,.3);
  }

  /* ── Corporate Body ── */
  .tpl-corporate .doc-page {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px; color: #1a1a1a; line-height: 1.65;
  }
  .tpl-corporate .doc-page h1 {
    font-size: 19px; font-weight: 700; color: #0F4C81;
    margin: 22px 0 10px; padding-bottom: 7px;
    border-bottom: 2px solid #0F4C81;
  }
  .tpl-corporate .doc-page h2 { font-size: 15px; font-weight: 700; color: #222; margin: 18px 0 7px; }
  .tpl-corporate .doc-page h3 { font-size: 13px; font-weight: 700; color: #444; margin: 14px 0 5px; }
  .tpl-corporate .doc-page p  { margin: 0 0 9px; }
  .tpl-corporate .doc-page blockquote { border-left: 3px solid #0F4C81; padding-left: 14px; color: #666; font-style: italic; margin: 12px 0; }
  .tpl-corporate .doc-page ul, .tpl-corporate .doc-page ol { padding-left: 18px; margin: 6px 0; }
  .tpl-corporate .doc-page li { margin: 3px 0; }
  .tpl-corporate .doc-page code { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; background: #f1f5f9; padding: 1px 5px; border-radius: 3px; color: #c2185b; }
  .tpl-corporate .doc-page pre { background: #f8fafc; padding: 14px; border-radius: 6px; overflow-x: auto; margin: 10px 0; border-left: 3px solid #0F4C81; }
  .tpl-corporate .doc-page pre code { background: none; padding: 0; color: #334155; }
  .tpl-corporate .doc-page hr  { border: none; border-top: 1px solid #e2e8f0; margin: 18px 0; }
  .tpl-corporate .doc-page a   { color: #0F4C81; text-decoration: underline; }
  .tpl-corporate .doc-page strong { font-weight: 700; }
  .tpl-corporate .doc-page em { font-style: italic; }
  .tpl-corporate .doc-page table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 12px; }
  .tpl-corporate .doc-page th { background: #0F4C81; color: #fff; padding: 8px 10px; text-align: left; }
  .tpl-corporate .doc-page td { padding: 7px 10px; border-bottom: 1px solid #e2e8f0; }
  .tpl-corporate .doc-page tr:nth-child(even) td { background: #f8fafc; }

  /* ── Modern Cover ── */
  .tpl-modern .doc-cover {
    background: linear-gradient(160deg, #07100a 0%, #0a160c 60%, #0d1e11 100%);
  }
  .tpl-modern .cov-topbar {
    height: 5px; flex-shrink: 0; background: #22c55e;
  }
  .tpl-modern .cov-inner {
    flex: 1; display: flex; flex-direction: column;
    justify-content: space-between;
    padding: 36px 56px 52px; position: relative; overflow: hidden;
  }
  /* Diagonal grid lines */
  .tpl-modern .cov-inner::before {
    content: ''; position: absolute; inset: 0;
    background-image: repeating-linear-gradient(
      -45deg, transparent, transparent 58px,
      rgba(34,197,94,.035) 58px, rgba(34,197,94,.035) 59px
    );
    pointer-events: none;
  }
  /* Glowing circle accent top-right */
  .tpl-modern .cov-inner::after {
    content: ''; position: absolute; top: -60px; right: -60px;
    width: 320px; height: 320px; border-radius: 50%;
    background: radial-gradient(circle, rgba(34,197,94,.07) 0%, transparent 70%);
    pointer-events: none;
  }
  .tpl-modern .cov-eyebrow {
    font-size: 10px; font-weight: 700; letter-spacing: .2em;
    text-transform: uppercase; color: rgba(34,197,94,.45);
    position: relative;
  }
  .tpl-modern .cov-mid { display: flex; flex-direction: column; position: relative; }
  .tpl-modern .cov-dash {
    width: 32px; height: 2px; background: #22c55e; margin-bottom: 18px; border-radius: 1px;
  }
  .tpl-modern .doc-cover h1 {
    font-size: 42px; font-weight: 200; color: #22c55e;
    line-height: 1.1; margin: 0 0 20px !important; letter-spacing: -1px;
  }
  .tpl-modern .cov-meta-line {
    font-size: 12px; color: rgba(255,255,255,.35);
    display: flex; align-items: center; gap: 12px;
  }
  .tpl-modern .cov-sep {
    width: 3px; height: 3px; border-radius: 50%;
    background: rgba(255,255,255,.2);
  }

  /* ── Modern Body ── */
  .tpl-modern .doc-page {
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px; color: #111; line-height: 1.85;
  }
  .tpl-modern .doc-page h1 { font-size: 22px; font-weight: 300; color: #22c55e; margin: 30px 0 14px; letter-spacing: -.5px; }
  .tpl-modern .doc-page h2 { font-size: 16px; font-weight: 500; color: #222; margin: 22px 0 9px; }
  .tpl-modern .doc-page h3 { font-size: 14px; font-weight: 600; color: #333; margin: 16px 0 7px; }
  .tpl-modern .doc-page p  { margin: 0 0 13px; }
  .tpl-modern .doc-page blockquote { border-left: 3px solid #22c55e; padding-left: 16px; color: #666; font-style: italic; margin: 14px 0; }
  .tpl-modern .doc-page ul, .tpl-modern .doc-page ol { padding-left: 18px; margin: 8px 0; }
  .tpl-modern .doc-page li { margin: 5px 0; }
  .tpl-modern .doc-page code { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; background: #f0fdf4; padding: 1px 5px; border-radius: 3px; color: #16a34a; }
  .tpl-modern .doc-page pre { background: #fafafa; padding: 16px; border-radius: 8px; overflow-x: auto; margin: 12px 0; border-left: 3px solid #22c55e; }
  .tpl-modern .doc-page pre code { background: none; padding: 0; color: #334155; }
  .tpl-modern .doc-page hr  { border: none; border-top: 1px solid #f0f0f0; margin: 26px 0; }
  .tpl-modern .doc-page a   { color: #16a34a; border-bottom: 1px solid #bbf7d0; }
  .tpl-modern .doc-page table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 12px; }
  .tpl-modern .doc-page th { border-bottom: 2px solid #22c55e; padding: 8px 10px; text-align: left; color: #22c55e; font-weight: 600; }
  .tpl-modern .doc-page td { padding: 7px 10px; border-bottom: 1px solid #f0f0f0; }

  /* ── Premium Cover ── */
  .tpl-premium .doc-cover {
    background: linear-gradient(170deg, #1a2b1c 0%, #2d4530 40%, #4a5f3e 70%, #c8d8be 100%);
    justify-content: center; align-items: center;
  }
  /* Subtle noise-like vignette */
  .tpl-premium .doc-cover::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 55%, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 72%);
    pointer-events: none;
  }
  .tpl-premium .cov-inner {
    flex: unset; display: flex; flex-direction: column;
    align-items: center; text-align: center;
    padding: 0 72px; position: relative; z-index: 1; width: 100%;
  }
  .tpl-premium .cov-ornament {
    display: flex; align-items: center; gap: 14px;
    color: rgba(255,255,255,.45); margin-bottom: 36px;
    font-size: 13px; letter-spacing: 4px;
  }
  .tpl-premium .cov-ornament::before,
  .tpl-premium .cov-ornament::after {
    content: ''; flex: 1; height: 1px;
    background: rgba(255,255,255,.2); min-width: 56px;
  }
  .tpl-premium .doc-cover h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 36px; font-weight: 700; color: #fff;
    line-height: 1.2; margin: 0 0 10px !important;
    text-shadow: 0 2px 24px rgba(0,0,0,.5);
  }
  .tpl-premium .cov-rule {
    width: 56px; height: 1px; background: rgba(255,255,255,.35);
    margin: 18px auto 18px;
  }
  .tpl-premium .cov-meta-line {
    font-size: 14px; color: rgba(255,255,255,.65);
    font-style: italic; font-family: Georgia, serif;
  }
  .tpl-premium .cov-date-line {

<script>
(function () {
  'use strict';

  /* Restore docx lib in case any CDN script clobbered it */
  if (window._docxLib) window.docx = window._docxLib;

  /* marked config */
  if (window.marked) marked.setOptions({ breaks: true, gfm: true });

  /* ─── TOKEN MAPPER ───────────────────────────────────── */
  const TokenMapper = {
    map(tokens) {
      const out = [];
      tokens.forEach(t => {
        const el = this.tok(t);
        if (el) Array.isArray(el) ? out.push(...el) : out.push(el);
      });
      return out;
    },
    tok(t) {
      const { Paragraph, TextRun } = window.docx;
      switch (t.type) {
        case 'heading': {
          /* Use our custom BM styles (BMH1/BMH2/BMH3) so Word's built-in
             heading theme colours don't override the template styles.
             Clamp depth to 1–3; fall back to BMH3 for deeper levels. */
          const depth = Math.min(t.depth || 1, 3);
          return new Paragraph({ children: this.inline(t.tokens || []), style: 'BMH' + depth });
        }
        case 'paragraph':
          return new Paragraph({ children: this.inline(t.tokens || []) });
        case 'space':
          return new Paragraph({ children: [] });
        case 'blockquote': {
          const inner = t.tokens && t.tokens[0] && t.tokens[0].tokens
            ? t.tokens[0].tokens
            : [{ type: 'text', text: t.text || '' }];
          return new Paragraph({ children: this.inline(inner), style: 'BMQuote' });
        }
        case 'list':
          return t.items.map((item, idx) => {
            const inner = item.tokens && item.tokens[0] && item.tokens[0].tokens
              ? item.tokens[0].tokens
              : [{ type: 'text', text: item.text || '' }];
            if (t.ordered) {
              const { TextRun } = window.docx;
              return new Paragraph({ children: [new TextRun({ text: `${t.start + idx}.  ` }), ...this.inline(inner)] });
            }
            return new Paragraph({ children: this.inline(inner), bullet: { level: 0 } });
          });
        case 'hr':
          return new Paragraph({ border: { top: { color:'auto', space:1, style:'single', size:6 } }, children:[] });
        case 'code':
          return new Paragraph({ children: [new TextRun({ text: t.text, font:'Courier New', size:20 })] });
        default:
          if (t.raw || t.text) return new Paragraph({ children:[new TextRun({ text: t.raw||t.text||'' })] });
          return null;
      }
    },
    inline(tokens, fmt = {}) {
      const { TextRun } = window.docx;
      const runs = [];
      if (!tokens || !tokens.length) return runs;
      tokens.forEach(t => {
        switch (t.type) {
          case 'text': case 'escape': case 'html':
            if (t.tokens && t.tokens.length) runs.push(...this.inline(t.tokens, fmt));
            else runs.push(new TextRun({ text: t.text || t.raw || '', ...fmt }));
            break;
          case 'strong':
            runs.push(...this.inline(
              t.tokens || [{ type:'text', text: t.text||'' }],
              { ...fmt, bold: true }
            ));
            break;
          case 'em':
            runs.push(...this.inline(
              t.tokens || [{ type:'text', text: t.text||'' }],
              { ...fmt, italic: true }
            ));
            break;
          case 'del':
            runs.push(...this.inline(
              t.tokens || [{ type:'text', text: t.text||'' }],
              { ...fmt, strike: true }
            ));
            break;
          case 'codespan':
            runs.push(new TextRun({ text: t.text, font:'Courier New', color:'c2185b', ...fmt })); break;
          case 'link':
            runs.push(new TextRun({ text: t.text||t.href, color:'0563C1', underline:{}, ...fmt })); break;
          default:
            if (t.tokens) runs.push(...this.inline(t.tokens, fmt));
            else if (t.text) runs.push(new TextRun({ text: t.text, ...fmt }));
        }
      });
      return runs;
    }
  };

  /* ─── CANVAS COVER IMAGE HELPER ─────────────────────── */
  /* Generates a PNG Uint8Array via canvas — used for docx cover pages */
  function canvasCoverPNG(w, h, drawFn) {
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    drawFn(canvas.getContext('2d'), w, h);
    const b64 = canvas.toDataURL('image/png').split(',')[1];
    const raw = atob(b64);
    const arr = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
    return arr;
  }

  function corporateCoverImg() {
    return canvasCoverPNG(793, 1122, (ctx, w, h) => {
      // Deep navy diagonal gradient
      const g = ctx.createLinearGradient(0, 0, w * 0.4, h);
      g.addColorStop(0, '#071e38');
      g.addColorStop(0.5, '#0c3d6e');
      g.addColorStop(1, '#0F4C81');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);

      // Large radial circle top-right
      const cg = ctx.createRadialGradient(w + 60, -60, 0, w + 60, -60, 480);
      cg.addColorStop(0, 'rgba(255,255,255,0.09)');
      cg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = cg;
      ctx.fillRect(0, 0, w, h);

      // Circle ring outlines
      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(w - 30, 110, 210, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(w - 30, 110, 300, 0, Math.PI * 2); ctx.stroke();

      // Light accent bar at top
      const bar = ctx.createLinearGradient(0, 0, w, 0);
      bar.addColorStop(0, '#3a8bc4'); bar.addColorStop(0.5, '#9cd3f7'); bar.addColorStop(1, '#3a8bc4');
      ctx.fillStyle = bar;
      ctx.fillRect(0, 0, w, 6);

      // Blue accent rule at ~72% down (aligns with where cover title appears in DOCX)
      ctx.fillStyle = '#5bb3e8';
      ctx.beginPath();
      ctx.roundRect(75, Math.round(h * 0.715), 55, 4, 2);
      ctx.fill();
    });
  }

  function modernCoverImg() {
    return canvasCoverPNG(793, 1122, (ctx, w, h) => {
      // Very dark gradient
      const g = ctx.createLinearGradient(0, 0, w, h);
      g.addColorStop(0, '#07100a'); g.addColorStop(0.6, '#0a160c'); g.addColorStop(1, '#0d1e11');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);

      // Diagonal grid lines
      ctx.strokeStyle = 'rgba(34,197,94,0.04)';
      ctx.lineWidth = 1;
      for (let i = -h; i < w + h; i += 80) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + h, h); ctx.stroke();
      }

      // Green radial glow top-right
      const glow = ctx.createRadialGradient(w + 50, -50, 0, w + 50, -50, 400);
      glow.addColorStop(0, 'rgba(34,197,94,0.09)');
      glow.addColorStop(1, 'rgba(34,197,94,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, w, h);

      // Green top bar
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(0, 0, w, 6);

      // Green dash accent at ~72% down
      ctx.fillStyle = '#22c55e';
      ctx.beginPath();
      ctx.roundRect(75, Math.round(h * 0.715), 38, 3, 1.5);
      ctx.fill();
    });
  }

  function premiumCoverImg() {
    return canvasCoverPNG(793, 1122, (ctx, w, h) => {
      // Rich sage forest gradient
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, '#1a2b1c'); g.addColorStop(0.4, '#2d4530');
      g.addColorStop(0.7, '#4a5f3e'); g.addColorStop(1, '#c8d8be');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);

      // Subtle diagonal sheen
      const sheen = ctx.createLinearGradient(w, 0, 0, h);
      sheen.addColorStop(0, 'rgba(255,255,255,0.06)');
      sheen.addColorStop(1, 'rgba(0,0,0,0.08)');
      ctx.fillStyle = sheen;
      ctx.fillRect(0, 0, w, h);

      // Center radial vignette
      const vig = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, Math.max(w, h) * 0.65);
      vig.addColorStop(0, 'rgba(0,0,0,0.38)');
      vig.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, w, h);

      // Ornament zone: centered at 42% to align with DOCX text block
      const mx = w / 2;
      const oy = h * 0.40; // ornament/diamond y position

      // Diamond
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.save();
      ctx.translate(mx, oy);
      ctx.rotate(Math.PI / 4);
      ctx.fillRect(-5, -5, 10, 10);
      ctx.restore();

      // Flanking lines at diamond level
      ctx.strokeStyle = 'rgba(255,255,255,0.22)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(mx - 120, oy); ctx.lineTo(mx - 18, oy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(mx + 18, oy); ctx.lineTo(mx + 120, oy); ctx.stroke();

      // Thin rule below text block (~57%)
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.beginPath(); ctx.moveTo(mx - 44, h * 0.57); ctx.lineTo(mx + 44, h * 0.57); ctx.stroke();
    });
  }

  function makeDocxBgImage(imgBytes) {
    const { ImageRun, HorizontalPositionAlign, VerticalPositionAlign,
            HorizontalPositionRelativeFrom, VerticalPositionRelativeFrom } = window.docx;
    return new ImageRun({
      data: imgBytes, transformation: { width: 793, height: 1122 },
      floating: {
        horizontalPosition: { relative: HorizontalPositionRelativeFrom.PAGE, align: HorizontalPositionAlign.LEFT },
        verticalPosition: { relative: VerticalPositionRelativeFrom.PAGE, align: VerticalPositionAlign.TOP },
        behindDocument: true, allowOverlap: true
      }
    });
  }

  /* ─── TEMPLATE FACTORY ───────────────────────────────── */
  const TF = {
    corporate: {
      styles: {
        default: {
          document: {
            run: { font:'Arial', size:24, color:'000000' },
            paragraph: { spacing:{ line:276, before:160, after:160 } }
          }
        },
        /* ── Custom IDs (BMH*) avoid conflict with Word's built-in Heading1/2/3 theme styles */
        paragraphStyles: [
          { id:'BMCoverTitle', name:'BM Cover Title', basedOn:'Normal', next:'Normal', quickFormat:true,
            run:{ size:80, bold:true, color:'FFFFFF' },
            /* spacing.before in twips: 72% of A4 height (16838) = 12123 → 12096 */
            paragraph:{ spacing:{before:12096,after:280}, alignment:window.docx.AlignmentType.LEFT } },
          { id:'BMCoverSub', name:'BM Cover Sub', basedOn:'Normal', next:'Normal', quickFormat:true,
            run:{ size:28, color:'C8DCF0' },
            paragraph:{ spacing:{before:120,after:120}, alignment:window.docx.AlignmentType.LEFT } },
          { id:'BMH1', name:'BM Heading 1', basedOn:'Normal', next:'Normal', quickFormat:true,
            run:{ font:'Arial', size:36, bold:true, color:'0F4C81' },
            paragraph:{ spacing:{before:400,after:200},
              border:{bottom:{color:'0F4C81',space:4,size:8,style:'single'}} } },
          { id:'BMH2', name:'BM Heading 2', basedOn:'Normal', next:'Normal', quickFormat:true,
            run:{ font:'Arial', size:28, bold:true, color:'222222' },
            paragraph:{ spacing:{before:280,after:140} } },
          { id:'BMH3', name:'BM Heading 3', basedOn:'Normal', next:'Normal', quickFormat:true,
            run:{ font:'Arial', size:24, bold:true, color:'444444' },
            paragraph:{ spacing:{before:200,after:100} } },
          { id:'BMQuote', name:'BM Quote', basedOn:'Normal', next:'Normal', quickFormat:true,
            run:{ italic:true, color:'666666' },
            paragraph:{ indent:{left:720}, border:{left:{color:'0F4C81',space:10,size:20,style:'single'}} } }
        ]
      },
      sections(els, meta) {
        const { Paragraph, TextRun, Header, Footer, AlignmentType, PageNumber, SectionType, BorderStyle } = window.docx;
        const bgImg = makeDocxBgImage(corporateCoverImg());
        const date  = new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
        const A4 = { width:11906, height:16838 };
        return [
          {
            /* Cover — A4, zero margins, full bleed */
            properties: { type:SectionType.NEXT_PAGE, page:{ size:A4, margin:{top:0,right:0,bottom:0,left:0} } },
            children: [
              new Paragraph({ spacing:{before:0,after:0,line:240}, children:[bgImg] }),
              new Paragraph({ text:meta.title||'Document Title', style:'BMCoverTitle' }),
              new Paragraph({ children:[
                new TextRun({ text:(meta.author||'Author'), font:'Arial', size:28, color:'C8DCF0' }),
                new TextRun({ text:'   ·   ', font:'Arial', size:28, color:'7aadce' }),
                new TextRun({ text:date, font:'Arial', size:28, color:'C8DCF0' })
              ], paragraph:{ spacing:{before:120,after:0}, alignment:AlignmentType.LEFT } })
            ]
          },
          {
            /* Body — A4, standard 1-inch margins */
            properties: { type:SectionType.NEXT_PAGE, page:{ size:A4, margin:{top:1440,right:1440,bottom:1440,left:1440} } },
            headers: { default: new Header({ children:[new Paragraph({
              alignment:AlignmentType.RIGHT,
              border:{bottom:{color:'0F4C81',space:1,style:BorderStyle.SINGLE,size:4}},
              children:[new TextRun({ text:meta.title||'BoardroomMD', font:'Arial', size:18, color:'888888', italics:true })]
            })] }) },
            footers: { default: new Footer({ children:[new Paragraph({
              alignment:AlignmentType.CENTER,
              children:[new TextRun({font:'Arial',size:18,color:'888888',children:['Page ']}),
                        new TextRun({font:'Arial',size:18,color:'888888',children:[PageNumber.CURRENT]}),
                        new TextRun({font:'Arial',size:18,color:'888888',children:[' of ']}),
                        new TextRun({font:'Arial',size:18,color:'888888',children:[PageNumber.TOTAL_PAGES]})]
            })] }) },
            children: els
          }
        ];
      }
    },

    modern: {
      styles: {
        default: {
          document: {
            run: { font:'Helvetica', size:22, color:'111111' },
            paragraph: { spacing:{ line:360, before:200, after:200 } }
          }
        },
        paragraphStyles: [
          { id:'BMCoverTitle', name:'BM Cover Title', basedOn:'Normal', next:'Normal', quickFormat:true,
            run:{ size:88, bold:false, color:'22c55e' },
            paragraph:{ spacing:{before:12096,after:400}, alignment:window.docx.AlignmentType.LEFT } },
          { id:'BMCoverSub', name:'BM Cover Sub', basedOn:'Normal', next:'Normal', quickFormat:true,
            run:{ size:28, color:'888888' },
            paragraph:{ spacing:{before:120,after:120}, alignment:window.docx.AlignmentType.LEFT } },
          { id:'BMH1', name:'BM Heading 1', basedOn:'Normal', next:'Normal', quickFormat:true,
            run:{ font:'Helvetica', size:44, bold:false, color:'22c55e' },
            paragraph:{ spacing:{before:560,after:280} } },
          { id:'BMH2', name:'BM Heading 2', basedOn:'Normal', next:'Normal', quickFormat:true,
            run:{ font:'Helvetica', size:32, bold:true, color:'333333' },
            paragraph:{ spacing:{before:380,after:180} } },
          { id:'BMH3', name:'BM Heading 3', basedOn:'Normal', next:'Normal', quickFormat:true,
            run:{ font:'Helvetica', size:26, bold:true, color:'444444' },
            paragraph:{ spacing:{before:260,after:120} } },
          { id:'BMQuote', name:'BM Quote', basedOn:'Normal', next:'Normal', quickFormat:true,
            run:{ italic:true, color:'888888' },
            paragraph:{ indent:{left:720}, border:{left:{color:'22c55e',space:10,size:20,style:'single'}} } }
        ]
      },
      sections(els, meta) {
        const { Paragraph, TextRun, Header, Footer, AlignmentType, PageNumber, SectionType, BorderStyle } = window.docx;
        const bgImg = makeDocxBgImage(modernCoverImg());
        const date  = new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
        const A4 = { width:11906, height:16838 };
        return [
          {
            properties: { type:SectionType.NEXT_PAGE, page:{ size:A4, margin:{top:0,right:0,bottom:0,left:0} } },
            children: [
              new Paragraph({ spacing:{before:0,after:0,line:240}, children:[bgImg] }),
              new Paragraph({ text:meta.title||'Document Title', style:'BMCoverTitle' }),
              new Paragraph({ children:[
                new TextRun({ text:(meta.author||'Author'), font:'Helvetica', size:28, color:'888888' }),
                new TextRun({ text:'   ·   ', font:'Helvetica', size:28, color:'555555' }),
                new TextRun({ text:date, font:'Helvetica', size:28, color:'888888' })
              ], paragraph:{ spacing:{before:120,after:0}, alignment:AlignmentType.LEFT } })
            ]
          },
          {
            properties: { type:SectionType.NEXT_PAGE, page:{ size:A4, margin:{top:1440,right:1440,bottom:1440,left:1440} } },
            headers: { default: new Header({ children:[new Paragraph({
              alignment:AlignmentType.LEFT,
              border:{bottom:{color:'22c55e',space:1,style:BorderStyle.SINGLE,size:6}},
              children:[new TextRun({ text:(meta.title||'BoardroomMD').toUpperCase(), font:'Helvetica', size:18, color:'22c55e', bold:true })]
            })] }) },
            footers: { default: new Footer({ children:[new Paragraph({
              alignment:AlignmentType.RIGHT,
              children:[new TextRun({font:'Helvetica',size:18,color:'aaaaaa',children:['Page ']}),
                        new TextRun({font:'Helvetica',size:18,color:'aaaaaa',children:[PageNumber.CURRENT]}),
                        new TextRun({font:'Helvetica',size:18,color:'aaaaaa',children:[' / ']}),
                        new TextRun({font:'Helvetica',size:18,color:'aaaaaa',children:[PageNumber.TOTAL_PAGES]})]
            })] }) },
            children: els
          }
        ];
      }
    },

    premium: {
      background: { color:'f5f7f4' },  /* matches the HTML preview .tpl-premium .doc-page background */
      styles: {
        default: {
          document: {
            run: { font:'Calibri', size:22, color:'454F3C' },
            paragraph: { spacing:{ line:300, before:160, after:160 } }
          }
        },
        paragraphStyles: [
          { id:'BMCoverTitle', name:'BM Cover Title', basedOn:'Normal', next:'Normal', quickFormat:true,
            run:{ size:76, bold:true, color:'FFFFFF' },
            /* spacing.before: 42% of A4 height (16838) = 7072 → 7200, aligns title below the canvas diamond ornament */
            paragraph:{ spacing:{before:7200,after:240}, alignment:window.docx.AlignmentType.CENTER } },
          { id:'BMCoverSub', name:'BM Cover Sub', basedOn:'Normal', next:'Normal', quickFormat:true,
            run:{ size:28, color:'DDDDDD', italic:true },
            paragraph:{ spacing:{before:120,after:100}, alignment:window.docx.AlignmentType.CENTER } },
          { id:'BMH1', name:'BM Heading 1', basedOn:'Normal', next:'Normal', quickFormat:true,
            run:{ font:'Calibri', size:38, bold:false, color:'454F3C' },
            paragraph:{ spacing:{before:400,after:200},
              border:{bottom:{color:'677659',space:4,size:6,style:'single'}} } },
          { id:'BMH2', name:'BM Heading 2', basedOn:'Normal', next:'Normal', quickFormat:true,
            run:{ font:'Calibri', size:30, bold:true, color:'677659' },
            paragraph:{ spacing:{before:280,after:140} } },
          { id:'BMH3', name:'BM Heading 3', basedOn:'Normal', next:'Normal', quickFormat:true,
            run:{ font:'Calibri', size:24, bold:true, color:'546347' },
            paragraph:{ spacing:{before:200,after:100} } },
          { id:'BMQuote', name:'BM Quote', basedOn:'Normal', next:'Normal', quickFormat:true,
            run:{ italic:true, color:'677659' },
            paragraph:{ indent:{left:720}, border:{left:{color:'677659',space:10,size:20,style:'single'}} } }
        ]
      },
      sections(els, meta) {
        const { Paragraph, TextRun, Header, Footer, AlignmentType, PageNumber, SectionType, BorderStyle } = window.docx;
        const bgImg = makeDocxBgImage(premiumCoverImg());
        const date  = new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
        const A4 = { width:11906, height:16838 };

        return [
          {
            properties:{ type:SectionType.NEXT_PAGE, page:{ size:A4, margin:{top:0,right:0,bottom:0,left:0} } },
            children:[
              new Paragraph({ spacing:{before:0,after:0,line:240}, children:[bgImg] }),
              new Paragraph({ text:meta.title||'Document Title', style:'BMCoverTitle' }),
              new Paragraph({ children:[
                new TextRun({ text:meta.author||'Author', font:'Calibri', size:26, color:'DDDDDD', italics:true })
              ], paragraph:{ spacing:{before:200,after:80}, alignment:AlignmentType.CENTER } }),
              new Paragraph({ children:[
                new TextRun({ text:date.toUpperCase(), font:'Calibri', size:20, color:'AAAAAA' })
              ], paragraph:{ spacing:{before:80,after:0}, alignment:AlignmentType.CENTER } })
            ]
          },
          {
            properties:{ type:SectionType.NEXT_PAGE, page:{ size:A4, margin:{top:1440,right:1440,bottom:1440,left:1440} } },
            headers:{ default: new Header({ children:[new Paragraph({
              alignment:AlignmentType.RIGHT,
              border:{bottom:{color:'677659',space:1,style:BorderStyle.SINGLE,size:4}},
              children:[new TextRun({ text:meta.title||'BoardroomMD', font:'Calibri', size:18, color:'677659' })]
            })] }) },
            footers:{ default: new Footer({ children:[new Paragraph({
              alignment:AlignmentType.CENTER,
              children:[
                new TextRun({font:'Calibri',size:18,color:'677659',children:['Page ']}),
                new TextRun({font:'Calibri',size:18,color:'677659',children:[PageNumber.CURRENT]}),
                new TextRun({font:'Calibri',size:18,color:'677659',children:[' of ']}),
                new TextRun({font:'Calibri',size:18,color:'677659',children:[PageNumber.TOTAL_PAGES]})
              ]
            })] }) },
            children: els
          }
        ];
      }
    }
  };

  /* ─── GENERATOR ──────────────────────────────────────── */
  async function generateBlob(els, tplId, meta) {
    const { Document, Packer } = window.docx;
    const tpl = TF[tplId] || TF.corporate;
    const sections = tpl.sections(els, meta);
    const cfg = {
      creator: meta.author || 'BoardroomMD',
      title: meta.title || 'Document',
      styles: tpl.styles,
      sections
    };
    if (tpl.background) cfg.background = tpl.background;
    return await Packer.toBlob(new Document(cfg));
  }

  /* ─── UI HELPERS ─────────────────────────────────────── */
  const $ = id => document.getElementById(id);

  let toastTimer;
  function toast(msg, type = 'success') {
    const el = $('toast');
    $('toastMsg').textContent = msg;
    $('toastIcon').textContent = type === 'success' ? '✓' : type === 'error' ? '✕' : '◌';
    el.className = 'show ' + type;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = ''; }, 3200);
  }

  function setStatus(state, msg) {
    $('statusDot').className = 'status-dot' + (state !== 'ready' ? ' ' + state : '');
    $('statusText').textContent = msg;
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ─── LIVE PREVIEW ───────────────────────────────────── */
  let renderTimer;
  function scheduleRender() { clearTimeout(renderTimer); renderTimer = setTimeout(render, 180); }

  function buildCoverHtml(tpl, title, author, date) {
    const t = esc(title), a = esc(author), d = esc(date);
    if (tpl === 'corporate') {
      return `<div class="doc-cover">
        <div class="cov-topbar"></div>
        <div class="cov-inner">
          <div class="cov-eyebrow">BoardroomMD</div>
          <div class="cov-mid">
            <div class="cov-rule"></div>
            <h1>${t}</h1>
            <div class="cov-meta-line">
              <span>${a}</span>
              <span class="cov-sep"></span>
              <span>${d}</span>
            </div>
          </div>
        </div>
      </div>`;
    }
    if (tpl === 'modern') {
      return `<div class="doc-cover">
        <div class="cov-topbar"></div>
        <div class="cov-inner">
          <div class="cov-eyebrow">BoardroomMD</div>
          <div class="cov-mid">
            <div class="cov-dash"></div>
            <h1>${t}</h1>
            <div class="cov-meta-line">
              <span>${a}</span>
              <span class="cov-sep"></span>
              <span>${d}</span>
            </div>
          </div>
        </div>
      </div>`;
    }
    if (tpl === 'premium') {
      return `<div class="doc-cover">
        <div class="cov-inner">
          <div class="cov-ornament">◆</div>
          <h1>${t}</h1>
          <div class="cov-rule"></div>
          <div class="cov-meta-line">${a}</div>
          <div class="cov-date-line">${d}</div>
        </div>
      </div>`;
    }
    return `<div class="doc-cover"><div class="cov-inner" style="justify-content:flex-end;padding:52px 60px">
      <h1 style="color:#fff;font-size:32px;font-weight:700">${t}</h1>
      <div style="color:rgba(255,255,255,.6);font-size:14px;margin-top:6px">${a}</div>
      <div style="color:rgba(255,255,255,.4);font-size:13px;margin-top:4px">${d}</div>
    </div></div>`;
  }

  function render() {
    const md     = $('markdownInput').value.trim();
    const tpl    = document.querySelector('input[name="template"]:checked')?.value || 'corporate';
    const title  = stripEmojiFromTitle($('docTitle').value.trim() || 'Untitled Document');
    const author = $('docAuthor').value.trim() || 'Author';
    const date   = new Date().toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });

    const empty = $('previewEmpty');
    const doc   = $('previewDoc');

    if (!md) {
      empty.style.display = 'flex';
      doc.style.display   = 'none';
      return;
    }

    empty.style.display = 'none';
    doc.style.display   = 'block';

    const bodyHtml = window.marked ? marked.parse(md) : '<p>' + esc(md) + '</p>';

    doc.innerHTML = `
      <div class="tpl-${tpl}">
        ${buildCoverHtml(tpl, title, author, date)}
        <div class="doc-page">${bodyHtml}</div>
      </div>`;

    $('previewScroll').scrollTop = 0;
  }

  /* ─── WORD COUNT ─────────────────────────────────────── */
  function updateWords() {
    const t = $('markdownInput').value.trim();
    const n = t ? t.split(/\s+/).length : 0;
    $('wordCount').textContent = n + (n === 1 ? ' word' : ' words');
  }

  /* ─── TITLE HELPERS ──────────────────────────────────── */
  let titleSetByUser = false;

  /* Strip emoji from a string (reuses the humanize ranges) */
  function stripEmojiFromTitle(s) {
    return s
      .replace(/[\u{1F000}-\u{1FFFF}]/gu, '')
      .replace(/[\u{2600}-\u{27BF}]/gu, '')
      .replace(/[\u{FE00}-\u{FE0F}]/gu, '')
      .replace(/[●▪▸►▶◆★☆✓✔✗✘]/g, '')
      .replace(/\s+/g, ' ').trim();
  }

  /* Truncate to max 4 words, append ellipsis if longer */
  function truncateTo4Words(s) {
    const words = s.split(/\s+/).filter(Boolean);
    if (words.length <= 4) return s;
    return words.slice(0, 4).join(' ') + '…';
  }

  function syncTitleFromMarkdown(md) {
    if (titleSetByUser) return;
    const match = md.match(/^#\s+(.+)$/m);
    if (match) {
      const raw     = match[1].replace(/[*_`~]/g, '').trim();
      const cleaned = truncateTo4Words(stripEmojiFromTitle(raw));
      if (cleaned) $('docTitle').value = cleaned;
    }
  }

  /* ─── HUMANIZE: REMOVE EMOJI & EM DASH ───────────────── */
  function humanize(text) {
    return text
      // Em dash → hyphen, en dash → hyphen
      .replace(/[—–]/g, '-')
      // Emoji (broad Unicode ranges)
      .replace(/[\u{1F600}-\u{1F64F}]/gu, '')
      .replace(/[\u{1F300}-\u{1F5FF}]/gu, '')
      .replace(/[\u{1F680}-\u{1F6FF}]/gu, '')
      .replace(/[\u{1F700}-\u{1F77F}]/gu, '')
      .replace(/[\u{1F780}-\u{1F7FF}]/gu, '')
      .replace(/[\u{1F800}-\u{1F8FF}]/gu, '')
      .replace(/[\u{1F900}-\u{1F9FF}]/gu, '')
      .replace(/[\u{1FA00}-\u{1FA6F}]/gu, '')
      .replace(/[\u{1FA70}-\u{1FAFF}]/gu, '')
      .replace(/[\u{2600}-\u{26FF}]/gu, '')
      .replace(/[\u{2700}-\u{27BF}]/gu, '')
      .replace(/[\u{FE00}-\u{FE0F}]/gu, '')
      .replace(/[\u{1F1E0}-\u{1F1FF}]/gu, '')
      // AI-favourite bullet symbols
      .replace(/[●▪▸►▶◆★☆✓✔✗✘✨🔹🔸]/g, '')
      // Collapse multiple spaces left behind
      .replace(/ {2,}/g, ' ')
      .replace(/^ /gm, '');
  }

  /* ─── WIRE UP ────────────────────────────────────────── */
  document.addEventListener('DOMContentLoaded', () => {
    if (window._docxLib) window.docx = window._docxLib;

    $('markdownInput').addEventListener('input', () => {
      syncTitleFromMarkdown($('markdownInput').value);
      updateWords();
      scheduleRender();
    });

    // If user manually edits the title field, stop auto-syncing; resume if cleared
    $('docTitle').addEventListener('input', () => {
      titleSetByUser = $('docTitle').value.trim().length > 0;
      scheduleRender();
    });
    $('docAuthor').addEventListener('input', scheduleRender);

    // Humanize button
    $('humanizeBtn').addEventListener('click', () => {
      const ta = $('markdownInput');
      const original = ta.value;
      const cleaned = humanize(original);
      if (cleaned === original) {
        toast('No emoji or em dashes found', 'loading');
        return;
      }
      ta.value = cleaned;
      ta.dispatchEvent(new Event('input'));
      const removed = original.length - cleaned.length;
      toast(`Removed ${removed} character${removed !== 1 ? 's' : ''} ✓`, 'success');
    });

    document.querySelectorAll('input[name="template"]').forEach(r => {
      r.addEventListener('change', () => {
        document.querySelectorAll('.tpl-card').forEach(c => c.classList.remove('is-active'));
        r.closest('.tpl-card')?.classList.add('is-active');
        scheduleRender();
      });
    });

    $('generateBtn').addEventListener('click', async () => {
      const md = $('markdownInput').value.trim();
      if (!md) { toast('Please write some Markdown first', 'error'); return; }

      if (window._docxLib) window.docx = window._docxLib;

      $('generateBtn').disabled = true;
      setStatus('loading', 'Generating…');
      toast('Building your document…', 'loading');

      try {
        const tokens = marked.lexer(md);
        const els    = TokenMapper.map(tokens);
        const meta   = {
          title:  stripEmojiFromTitle($('docTitle').value.trim()  || 'Generated Document'),
          author: $('docAuthor').value.trim() || 'Author'
        };
        const tplId = document.querySelector('input[name="template"]:checked')?.value || 'corporate';
        const blob  = await generateBlob(els, tplId, meta);
        const fname = (meta.title.replace(/\s+/g, '_') || 'Document') + '.docx';
        window.saveAs(blob, fname);
        setStatus('ready', 'Download complete');
        toast('Downloaded ' + fname + ' ✓', 'success');
        setTimeout(() => setStatus('ready', 'Ready'), 3000);
      } catch (err) {
        console.error(err);
        setStatus('error', 'Error');
        toast('Error: ' + err.message, 'error');
        setTimeout(() => setStatus('ready', 'Ready'), 4000);
      } finally {
        $('generateBtn').disabled = false;
      }
    });
  });

})();
</script>
